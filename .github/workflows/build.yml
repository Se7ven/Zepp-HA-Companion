name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build .zab package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (zeus build)
        run: npm run build

      - name: Upload .zab artifact
        uses: actions/upload-artifact@v4
        with:
          name: zepp-ha-companion-zab
          path: dist/*.zab
          if-no-files-found: error
