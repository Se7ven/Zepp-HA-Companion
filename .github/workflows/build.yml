name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set app version (main push -> commit hash)
        if: github.event_name == 'push'
        run: node scripts/ci-version.cjs "${GITHUB_SHA::7}"
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Set app version (pull request)
        if: github.event_name == 'pull_request'
        run: node scripts/ci-version.cjs "pr-${{ github.event.number }}"

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: zepp-ha-companion-zab
          path: dist/*.zab
          if-no-files-found: error
